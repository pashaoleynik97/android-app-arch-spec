# Component manifest — the single source of truth for what can be installed.
# Read by INSTALL.md (the agent) and installer/render.py (the renderer).
#
# Fields
#   tier          core | recommended
#   depends_on    components that must be installed first (the installer offers to add them)
#   payload       directory under payload/ whose tree mirrors the target project root
#   replaces      stock files of an empty Android Studio project this component may overwrite on a FRESH install
#   removes       stock files this component deletes on a fresh install (globs, rendered)
#   settings_includes  Gradle modules to add to settings.gradle.kts (inside the arch-spec marker block)
#   app_dependencies   `:app` dependency lines to add (inside the arch-spec marker block of app/build.gradle.kts)
#   parameters    parameters this component's payload uses (for the questionnaire)
#   gate          commands that must succeed after installing (run from the target root)
#   skill_refs    reference files this component contributes to the installed skills (shipped inside its own payload
#                 under .claude/skills/<skill>/references/; listed here for doctor/lint)
#   inserts       extra marker-block edits: [{file, marker, lines}] — lines are unique-merged between
#                 `<arch-spec:MARKER>` / `</arch-spec:MARKER>` comment lines (// , # or <!-- -->) in `file`.
#                 Inserts of ALL installed components are re-applied after every install, so a component installed
#                 before ai-layer still gets its skill-index / CLAUDE.md lines once ai-layer arrives.
#                 Standard markers: settings.gradle.kts `includes`, app/build.gradle.kts `app-dependencies`,
#                 App.kt `feature-registrations`, CLAUDE.md `modules` + `components`,
#                 .claude/skills/<skill>/SKILL.md `references`.
#   doc           the per-component install procedure

schema: 1

components:

  foundation:
    tier: core
    depends_on: []
    payload: foundation
    replaces:
      - settings.gradle.kts
      - build.gradle.kts
      - gradle.properties
      - gradle/libs.versions.toml
      - app/build.gradle.kts
      - .gitignore
      - gradle/gradle-daemon-jvm.properties
      - gradle/wrapper/gradle-wrapper.properties
    removes:
      - app/proguard-rules.pro
    settings_includes: []
    app_dependencies: []
    parameters: [PROJECT_SLUG, APPLICATION_ID, APP_PACKAGE, ROOT_PACKAGE, CONVENTION_PREFIX, MIN_SDK, TARGET_SDK, COMPILE_SDK, JVM_TARGET, KEYSTORE_FILE]
    gate:
      - ./gradlew help
      - ./gradlew :app:assembleDebug
    skill_refs: [application-architecture/references/build-system.md, application-architecture/references/toolchain.md]
    inserts:
      - file: .claude/skills/application-architecture/SKILL.md
        marker: references
        lines:
          - "- [build-system.md](references/build-system.md) — build-logic convention plugins, catalog, root files, test defaults, versioning, signing, R8 (component: foundation)"
          - "- [toolchain.md](references/toolchain.md) — coupled version groups, safe upgrade order, version-conditional gotchas, diagnosing a red build (component: foundation)"
      - file: CLAUDE.md
        marker: components
        lines:
          - "- **foundation** — root Gradle files, version catalog, `build-logic` convention plugins (`{{CONVENTION_PREFIX}}.android.*`), versioning and signing in `app/build.gradle.kts`."
    doc: installer/components/foundation.md

  architecture:
    tier: core
    depends_on: [foundation]
    payload: architecture
    replaces:
      - app/src/main/AndroidManifest.xml
      - app/src/main/java/{{APP_PACKAGE_PATH}}/MainActivity.kt
      - app/src/main/res/values/strings.xml
      - app/src/main/res/values/themes.xml
      - app/src/main/res/xml/backup_rules.xml          # stock samples → versions with backup-exclusion marker blocks
      - app/src/main/res/xml/data_extraction_rules.xml
    removes:
      - app/src/main/java/{{STOCK_APP_PACKAGE_PATH}}/MainActivity.kt
      - app/src/main/res/values/colors.xml              # stock purple/teal; colours come from the theme tokens (DS-03)
      - app/src/main/java/{{STOCK_APP_PACKAGE_PATH}}/ui/theme/*.kt
      - app/src/test/java/{{STOCK_APP_PACKAGE_PATH}}/ExampleUnitTest.kt
      - app/src/androidTest/java/{{STOCK_APP_PACKAGE_PATH}}/ExampleInstrumentedTest.kt
    settings_includes: [":lib-common", ":lib-android", ":feature-api", ":core-testing"]
    app_dependencies: ['implementation(project(":lib-common"))', 'implementation(project(":lib-android"))', 'implementation(project(":feature-api"))']
    parameters: [APP_NAME, ROOT_PACKAGE, APP_PACKAGE, THEME_PREFIX, BASE_LOCALE, EXTRA_LOCALES, COLOR_PRIMARY, COLOR_ERROR, COLOR_SUCCESS, COLOR_WARNING, FONT_FAMILY, REFERENCE_DEVICE_DP, THEME_MODE, FIGMA_URL]
    gate:
      - ./gradlew assembleDebug
      - ./gradlew testDebugUnitTest
    skill_refs: [application-architecture/references/modules.md, application-architecture/references/kernel.md, application-architecture/references/presentation.md, application-architecture/references/di.md, application-architecture/references/feature-trio.md, application-architecture/references/testing.md, compose-ui/references/tokens.md, compose-ui/references/uikit.md, compose-ui/references/host-chrome.md, compose-ui/references/screen-layout.md, application-architecture/references/data-and-errors.md]
    inserts:
      - file: .claude/skills/application-architecture/SKILL.md
        marker: references
        lines:
          - "- [modules.md](references/modules.md) — module graph, kernel modules, infra modules, the host and its extension seams, naming (component: architecture)"
          - "- [feature-trio.md](references/feature-trio.md) — contract / UI / domain modules, package layout, registration, seams between siblings (component: architecture)"
          - "- [di.md](references/di.md) — Hilt entry points, module placement and shape, qualifiers, scopes, multibindings, eager singletons (component: architecture)"
          - "- [kernel.md](references/kernel.md) — Reporter, Scopes, AppForegroundWatch, dispatcher and clock seams, stores (component: architecture)"
          - "- [presentation.md](references/presentation.md) — ViewModel contract, lifecycle-gated work, notices, routes and results, permissions (component: architecture)"
          - "- [data-and-errors.md](references/data-and-errors.md) — domain shape, sealed results and rungs, DTOs, validators, caches, writes (component: architecture)"
          - "- [testing.md](references/testing.md) — the JVM kit, core-testing, fakes, what to test per layer, naming (component: architecture)"
      - file: .claude/skills/compose-ui/SKILL.md
        marker: references
        lines:
          - "- [tokens.md](references/tokens.md) — colors, typography, dimens, theme mode, adding tokens, when the design arrives (component: architecture)"
          - "- [uikit.md](references/uikit.md) — kit inventory, button and row, text field, banner data, sheets, dialogs, icons (component: architecture)"
          - "- [host-chrome.md](references/host-chrome.md) — app bar, banners, app menu via Set… effects, banner layering, insets (component: architecture)"
          - "- [screen-layout.md](references/screen-layout.md) — anatomy of a screen, structure, previews, branded surfaces, system bars (component: architecture)"
      - file: CLAUDE.md
        marker: components
        lines:
          - "- **architecture** — kernel modules, the host (`:app`), design system and UI kit, `:core-testing`, the reference feature `home`; new features via the **add-feature** skill."
      - file: CLAUDE.md
        marker: modules
        lines:
          - "- `:app` `{{APP_PACKAGE}}` — host: App (feature registration), MainActivity, AppNavHost (single NavHost + host chrome)"
          - "- `:lib-common` `{{ROOT_PACKAGE}}.libcommon` — kernel: Reporter + logTag, Scopes, AppForegroundWatch, DispatcherProvider, TimeSource (no Compose, no UI)"
          - "- `:feature-api` `{{ROOT_PACKAGE}}.featureapi` — FeatureApi contract + FeaturesHolder registry"
          - "- `:lib-android` `{{ROOT_PACKAGE}}.libandroid` — {{THEME_PREFIX}}Theme tokens, host chrome (AppStatusBar, TopSnackbar, app menu), base UI kit, BaseViewModel, nav helpers"
          - "- `:core-testing` `{{ROOT_PACKAGE}}.coretesting` — MainDispatcherRule, TestDispatcherProvider, FakeTimeSource, RecordingReporter (testImplementation only)"
          - "- `:<feature>-ui-api` / `:<feature>-ui` / `:<feature>` `{{ROOT_PACKAGE}}.<feature>.ui.api` / `.ui` / `.domain` — one trio per feature (`home` is the start destination)"
    doc: installer/components/architecture.md

  ai-layer:
    tier: core
    depends_on: [foundation]
    payload: ai-layer
    replaces: []
    removes: []
    settings_includes: []
    app_dependencies: []
    parameters: [APP_NAME, PROJECT_SLUG, ROOT_PACKAGE, CONVENTION_PREFIX, THEME_PREFIX]
    gate:
      - bash tools/skills/lint.sh
      - bash tools/skills/check-refs.sh
    skill_refs: [skills-maintenance/references/amend.md, skills-maintenance/references/capture.md, skills-maintenance/references/audit.md, skills-maintenance/references/hygiene.md, skills-maintenance/references/new-skill.md, skills-maintenance/references/upgrade.md, skills-maintenance/references/rename-module.md]
    inserts:
      - file: CLAUDE.md
        marker: components
        lines:
          - "- **ai-layer** — this file, the skills in `.claude/skills/`, path-scoped rules in `.claude/rules/`, the task workflow in `.claude/workflow/`, skill tooling in `tools/skills/`."
    doc: installer/components/ai-layer.md

  docs:
    tier: core
    depends_on: [foundation]
    payload: docs
    replaces: []                # a README the user already has is never overwritten → .arch-spec-new
    removes: []
    settings_includes: []
    app_dependencies: []
    parameters: [APP_NAME, PROJECT_SLUG]
    gate: []
    skill_refs: []
    inserts:
      - file: CLAUDE.md
        marker: components
        lines:
          - "- **docs** — `README.md`, layered behaviour docs in `.docs/` (PO / QA / developer parts), decision records in `.docs/decisions/`."
    doc: installer/components/docs.md

