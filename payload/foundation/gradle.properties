# Project-wide Gradle settings. Settings configured through the IDE override this file.

# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Parallel project execution. The module graph is decoupled (convention plugins, no cross-project
# configuration), so it is safe to turn on once the project has more than a handful of modules.
# org.gradle.parallel=true

# Configuration cache: Gradle skips the configuration phase when nothing that affects it changed.
# Consequence for build scripts: read files through `providers.fileContents(...)` and environment through
# `providers.environmentVariable(...)` (see app/build.gradle.kts), never with java.io at configuration time.
org.gradle.configuration-cache=true

# Kotlin code style: "official" or "obsolete".
kotlin.code.style=official

# AGP 9 compiles Kotlin itself (built-in Kotlin) and by default rejects the legacy `kotlin.sourceSets` DSL.
# KSP (used by Hilt) still registers its generated sources through that DSL, so it must be allowed until KSP
# migrates. Removing this line breaks every module that applies the hilt convention.
android.disallowKotlinSourceSets=false
